# InfluxDB v3 backend settings -- sourced after bench.conf when this is the
# write and/or query backend. Every value may be overridden from the
# environment.
#
# See README.md for what this backend runs (edition/version), how writing
# works across multiple SERVER_HOSTS entries, auth, and the query side.

# Where the InfluxDB 3 server listens. Must be reachable from every write
# host and the query host. Also the SERVER_HOSTS entry treated as "the"
# influxdb3 server -- see README.md.
INFLUX_HOST="${INFLUX_HOST:-http://${SERVER_HOSTS%% *}:8181}"
# Database (v3 calls it a database; the v1/v2 term is bucket).
INFLUX_DATABASE="${INFLUX_DATABASE:-monbench}"

# Interface used to talk to InfluxDB:
#   python  the influxdb_client_3 library (default)
#   http    the InfluxDB 3 HTTP API directly, via urllib
INFLUX_INTERFACE="${INFLUX_INTERFACE:-python}"
# Query language: sql (default) or influxql.
INFLUX_QUERY_LANG="${INFLUX_QUERY_LANG:-sql}"
# Line-protocol timestamp precision. The data set uses whole seconds.
INFLUX_PRECISION="${INFLUX_PRECISION:-s}"
# Node records per write request. Defaults to BATCH, so a batch means the
# same thing for every backend; each request is one latency sample.
INFLUX_WRITE_BATCH="${INFLUX_WRITE_BATCH:-${BATCH:-500}}"

# Data directory for influxdb3 on the designated server host (see
# README.md). Only one influxdb3 instance runs per benchmark pair, so this
# path is fixed (not keyed by hostname). Placed under the designated host's
# nodes/<hostname>/data/ so the harness owns it and 'clean' wipes it.
# Override to place data on a specific mount (e.g. a fast local disk on the
# InfluxDB host).
INFLUX_DATA_DIR="${INFLUX_DATA_DIR:-${OUTPUT_DIR}/nodes/${HOST:-${HOSTNAME}}/data/influxdb}"

# Path to the JSON token file generated by plugin_serve_start. Placed under
# the designated host's nodes/<hostname>/run/ with the other daemon runtime
# files. Every server node reads this file (to authenticate writes to the
# single influxdb3 instance), so the path must resolve to the *designated*
# host -- not the local hostname. ${SERVER_HOSTS%% *} is the same expression
# INFLUX_HOST uses to identify the designated host.
# Set automatically; override only if you are managing the token yourself.
INFLUX_TOKEN_FILE="${INFLUX_TOKEN_FILE:-${OUTPUT_DIR}/nodes/${SERVER_HOSTS%% *}/run/influxdb3-token.json}"

# ---- plugin declarations read by the core
PLUGIN_DESC="writes to and queries an InfluxDB 3 Core server (token generated at serve time)"
DEFAULT_WRITERS="influx"
# The harness starts and stops influxdb3 on the designated server host (see
# README.md); PLUGIN_SERVICE=1 still applies to every SERVER_HOSTS entry at
# the bin/run.sh level, same as sos/dsos -- influxdb_plugin.sh is what
# narrows that down to one host.
PLUGIN_SERVICE=1
# Written data this backend can query.
PLUGIN_READS="influxdb"
PLUGIN_VARS="INFLUX_HOST INFLUX_DATABASE INFLUX_INTERFACE INFLUX_QUERY_LANG INFLUX_PRECISION INFLUX_WRITE_BATCH"
